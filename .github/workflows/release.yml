name: Deploy

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build and publish deploy branch
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: B2XKlaim-FrontEnd/package-lock.json

      - name: Build frontend
        working-directory: B2XKlaim-FrontEnd
        env:
          VUE_APP_API_URL: https://kbourr.com/b2api
        run: |
          npm ci
          npm run build

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build backend jar
        working-directory: B2XKlaim-BackEnd
        run: mvn -B clean package -DskipTests

      - name: Prepare deploy layout
        run: |
          STAGE="$RUNNER_TEMP/deploy"
          mkdir -p "$STAGE/b2xklaim" "$STAGE/b2api"
          cp -r B2XKlaim-FrontEnd/dist/* "$STAGE/b2xklaim/"
          cp B2XKlaim-BackEnd/target/B2XKlaim-*.jar "$STAGE/b2api/"
          echo "STAGE_PATH=$STAGE" >> "$GITHUB_ENV"

      - name: Push to deploy branch
        run: |
          STAGE="$STAGE_PATH"
          cd "$STAGE"
          git init -b deploy
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git -c gc.auto=0 commit -m "Deploy $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:deploy

  deploy-server:
    name: Deploy to kbourr.com over SSH
    needs: build-and-deploy
    runs-on: ubuntu-latest
    steps:
      - name: Run deploy script on server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -euo pipefail
            if [ -x "$HOME/deploy-b2xklaim.sh" ]; then
              "$HOME/deploy-b2xklaim.sh"
            elif [ -x "$HOME/kbourr.com/b2api/deploy-b2xklaim.sh" ]; then
              "$HOME/kbourr.com/b2api/deploy-b2xklaim.sh"
            else
              echo "deploy-b2xklaim.sh not found; falling back to inline deploy"
              REPO_URL="https://github.com/${{ github.repository }}.git"
              TMP_DIR="/tmp/b2xklaim-deploy"
              rm -rf "$TMP_DIR"
              git clone --depth 1 -b deploy "$REPO_URL" "$TMP_DIR"
              rm -rf "$HOME/kbourr.com/b2xklaim"
              cp -r "$TMP_DIR/b2xklaim" "$HOME/kbourr.com/b2xklaim"
              cp "$TMP_DIR"/b2api/B2XKlaim-*.jar "$HOME/kbourr.com/b2api/"
              if [ -f "$HOME/kbourr.com/b2api/app-control.sh" ]; then
                "$HOME/kbourr.com/b2api/app-control.sh" restart || echo "restart failed"
              fi
              rm -rf "$TMP_DIR"
            fi
