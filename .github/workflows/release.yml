name: Deploy

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build and publish deploy branch
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: B2XKlaim-FrontEnd/package-lock.json

      - name: Build frontend
        working-directory: B2XKlaim-FrontEnd
        run: |
          npm ci
          npm run build

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build backend jar
        working-directory: B2XKlaim-BackEnd
        run: mvn -B clean package -DskipTests

      - name: Prepare deploy layout
        run: |
          STAGE="$RUNNER_TEMP/deploy"
          mkdir -p "$STAGE/b2xklaim" "$STAGE/b2api"
          cp -r B2XKlaim-FrontEnd/dist/* "$STAGE/b2xklaim/"
          cp B2XKlaim-BackEnd/target/B2XKlaim-*.jar "$STAGE/b2api/"
          echo "STAGE_PATH=$STAGE" >> "$GITHUB_ENV"

      - name: Push to deploy branch
        run: |
          STAGE="$STAGE_PATH"
          cd "$STAGE"
          git init -b deploy
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git -c gc.auto=0 commit -m "Deploy $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:deploy